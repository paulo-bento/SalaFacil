<div class="auth-field{% if full %} auth-full{% endif %}">
    <label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
    {{ field }}
    {% if field.help_text %}
        <div id="{{ field.auto_id }}_helptext" hidden>{{ field.help_text }}</div>
    {% endif %}
    {% if field.errors %}
        <div class="auth-field-error" role="alert">{{ field.errors }}</div>
    {% endif %}
</div>
